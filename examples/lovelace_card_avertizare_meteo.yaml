# Card Lovelace „AVERTIZARE METEO” — stil dashboard Acasă (ha-lenovo)
#
# Dependențe HACS (la fel ca pe Acasă):
#   - button-card (custom:button-card)
#   - fold-entity-row (custom:fold-entity-row)
#
# Exemplu pentru județul Galați. Înlocuiește „galati” în entity_id
# cu slug-ul județului tău (Developer Tools → States).
#
# Stil hartă: Settings → Devices → Cod Galben → Configure
#   Tip hartă: oficial | gis | ambele
#   Fundal GIS: osm (OpenStreetMap) | topo (relief OpenTopoMap)
# Cardul citește map_style + gis_basemap de pe binary_sensor.

type: custom:fold-entity-row
padding: 0
clickable: true
head:
  type: custom:button-card
  entity: sensor.cod_galben_galati_nivel_avertizare
  name: AVERTIZARE METEO
  icon: mdi:alert
  show_name: true
  show_icon: true
  show_state: false
  tap_action:
    action: none
  styles:
    card:
      - background-color: transparent
      - box-shadow: none
      - padding: 0
      - margin: 0
      - pointer-events: none
    icon:
      - width: 22px
      - height: 22px
      - color: |
          [[[
            const n = (entity.state || 'none').toLowerCase();
            if (n === 'rosu' || n === 'roșu') return '#ea3323';
            if (n === 'portocaliu') return '#f09035';
            if (n === 'galben') return '#ffde07';
            if (n === 'informare') return '#9e9e9e';
            return '#3498db';
          ]]]
    name:
      - font-weight: 900
      - font-size: 16px
      - text-transform: uppercase
      - color: |
          [[[
            const n = (entity.state || 'none').toLowerCase();
            if (n === 'rosu' || n === 'roșu') return '#ea3323';
            if (n === 'portocaliu') return '#f09035';
            if (n === 'galben') return '#ffde07';
            if (n === 'informare') return '#9e9e9e';
            return '#3498db';
          ]]]
entities:
  - type: custom:button-card
    entity: binary_sensor.cod_galben_galati_avertizare_activa
    show_name: false
    show_state: false
    show_icon: false
    show_label: true
    tap_action:
      action: url
      url_path: https://www.meteoromania.ro/avertizari/
    styles:
      card:
        - padding: 12px
        - border-radius: 12px
      label:
        - text-align: left
        - font-size: 13px
        - white-space: normal
    label: |
      [[[
        return (function () {
          const bin = states['binary_sensor.cod_galben_galati_avertizare_activa'];
          const fenomene = states['sensor.cod_galben_galati_fenomene']?.state || '';
          const interval = states['sensor.cod_galben_galati_interval_avertizare']?.state || '';
          const judet = bin?.attributes?.judet_nume || 'Galați';
          const warnings = bin?.attributes?.warnings || [];

          const colorFor = (n) => {
            const x = (n || '').toLowerCase();
            if (x === 'rosu' || x === 'roșu') return '#ea3323';
            if (x === 'portocaliu') return '#f09035';
            if (x === 'galben') return '#ffde07';
            if (x === 'informare') return '#9e9e9e';
            return '#3498db';
          };

          const badge = (n) => {
            const x = (n || '').toLowerCase();
            if (x === 'galben')
              return '<span style="background:#ffde07;color:black;padding:1px 6px;border-radius:3px;margin-left:6px;font-weight:bold;">COD GALBEN</span>';
            if (x === 'portocaliu')
              return '<span style="background:#f09035;color:black;padding:1px 6px;border-radius:3px;margin-left:6px;font-weight:bold;">COD PORTOCALIU</span>';
            if (x === 'rosu' || x === 'roșu')
              return '<span style="background:#ea3323;color:white;padding:1px 6px;border-radius:3px;margin-left:6px;font-weight:bold;">COD ROȘU</span>';
            if (x === 'informare')
              return '<span style="background:#9e9e9e;color:white;padding:1px 6px;border-radius:3px;margin-left:6px;font-weight:bold;">INFORMARE</span>';
            return '';
          };

          // Stil hartă din opțiuni integrare
          const mapStyle = (bin?.attributes?.map_style || 'oficial').toLowerCase();
          const gisBasemap = (bin?.attributes?.gis_basemap || 'osm').toLowerCase();
          const showOficial = mapStyle === 'oficial' || mapStyle === 'ambele';
          const showGis = mapStyle === 'gis' || mapStyle === 'ambele';

          // Hărți ANM: map_id pe fiecare warning (Cod Galben) + /local/harta_anm_{id}.svg
          const allIds = (bin?.attributes?.map_ids || []).map(String);

          const mapImg = (id, path) => {
            if (!id || !showOficial) return '';
            const local = `${(path || `/local/cod_galben/harta_anm_${id}.svg`).split('?')[0]}?v=1.3.7`;
            const legacy = `/local/harta_anm_${id}.svg?v=1.3.7`;
            return `<div style="text-align:center;margin-top:10px;margin-bottom:6px;">
              <div style="font-size:11px;opacity:0.7;margin-bottom:4px;">Hartă oficială ANM</div>
              <img src="${local}"
                   onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='${legacy}';}else{this.onerror=null;}"
                   alt="Hartă oficială ANM"
                   style="width:100%;max-width:480px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.25);" />
            </div>`;
          };

          const mapGis = (id, path) => {
            if (!id || !showGis) return '';
            let src = path || `/local/cod_galben/gis_${id}.json`;
            if (src.endsWith('.svg')) src = src.slice(0, -4) + '.json';
            const tiles = (gisBasemap === 'topo') ? 'topo' : 'osm';
            const iframe = `/local/cod_galben/map.html?v=1.3.11&tiles=${tiles}&src=${encodeURIComponent(src)}`;
            const label = tiles === 'topo' ? 'Hartă GIS (relief)' : 'Hartă GIS (Leaflet / OSM)';
            return `<div style="text-align:center;margin-top:8px;margin-bottom:10px;">
              <div style="font-size:11px;opacity:0.7;margin-bottom:4px;">${label}</div>
              <iframe src="${iframe}" title="Hartă GIS ${id}" loading="lazy"
                      style="width:100%;max-width:520px;height:360px;border:0;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.2);background:#fff;"></iframe>
            </div>`;
          };

          const resolveMapId = (w, index) => {
            if (w.map_id) return String(w.map_id);
            const excerpt = `${w.message_excerpt || ''} ${w.mesaj || ''} ${w.tip || ''}`;
            const m = excerpt.match(/MESAJ\s+(\d+)\s*\/\s*\d+/i);
            if (m && allIds.length) {
              const byIndex = allIds[Number(m[1]) - 1];
              if (byIndex) return byIndex;
            }
            return allIds[index] || null;
          };

          const escapeHtml = (s) => String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

          // Bold + warning colour for this county / its ANM subregion
          // (GL: sudul Moldovei — not nord-estul Moldovei).
          const highlightLocal = (text, color, names, bareNames) => {
            const escaped = escapeHtml(text);
            if (!escaped) return '';
            const skipBefore = /(?:nord-estul|nord-vestul|sud-estul|sud-vestul|nordul|sudul|estul|vestul)\s+$/i;
            const isWord = (ch) => ch && /[0-9A-Za-zĂÂÎȘȚăâîșțŞşŢţ]/.test(ch);
            const all = [];
            (names || []).forEach((n) => { const s = String(n || '').trim(); if (s) all.push({ s, bare: false }); });
            (bareNames || []).forEach((n) => { const s = String(n || '').trim(); if (s) all.push({ s, bare: true }); });
            all.sort((a, b) => b.s.length - a.s.length);
            const ranges = [];
            const lower = escaped.toLowerCase();
            for (const item of all) {
              const needle = escapeHtml(item.s);
              const nl = needle.toLowerCase();
              if (!nl) continue;
              let from = 0;
              while (from <= lower.length - nl.length) {
                const idx = lower.indexOf(nl, from);
                if (idx < 0) break;
                from = idx + 1;
                const beforeCh = idx === 0 ? '' : escaped[idx - 1];
                const afterCh = idx + needle.length >= escaped.length ? '' : escaped[idx + needle.length];
                if (isWord(beforeCh) || isWord(afterCh)) continue;
                if (ranges.some((r) => !(idx + needle.length <= r.start || idx >= r.end))) continue;
                if (item.bare) {
                  const prefix = escaped.slice(Math.max(0, idx - 24), idx);
                  if (skipBefore.test(prefix)) continue;
                }
                ranges.push({ start: idx, end: idx + needle.length });
              }
            }
            ranges.sort((a, b) => a.start - b.start);
            let out = '';
            let cursor = 0;
            const open = `<b style="color:${color};font-weight:800;">`;
            for (const r of ranges) {
              out += escaped.slice(cursor, r.start) + open + escaped.slice(r.start, r.end) + '</b>';
              cursor = r.end;
            }
            return out + escaped.slice(cursor);
          };

          const mesajLabel = (w, index, total) => {
            let nr = w.mesaj_nr;
            let tot = w.mesaj_total;
            if (!nr || !tot) {
              const blob = `${w.message_excerpt || ''} ${w.mesaj || ''} ${w.tip || ''}`;
              const m = blob.match(/MESAJ\s+(\d+)\s*\/\s*(\d+)/i);
              if (m) {
                nr = Number(m[1]);
                tot = Number(m[2]);
              }
            }
            if (nr && tot) return `Mesaj ${nr}/${tot}`;
            if (total > 1) return `Mesaj ${index + 1}/${total}`;
            return '';
          };

          if (!bin || bin.state !== 'on' || !warnings.length) {
            return `<div style="opacity:0.75;">Nicio avertizare activă pentru <b>${judet}</b>.</div>`;
          }

          let html = '';
          const usedIds = new Set();
          for (let i = 0; i < warnings.length; i++) {
            const w = warnings[i];
            const c = colorFor(w.level);
            const titlu = (w.tip || 'Avertizare').toUpperCase();
            const iv = w.interval_text || interval || '—';
            const fen = w.fenomene || fenomene || '—';
            const detalii = w.mesaj || w.message_excerpt || '';
            const mesaj = mesajLabel(w, i, warnings.length);
            html += `<div style="margin-bottom:16px;border-left:4px solid ${c};padding-left:10px;">`;
            html += `<div style="font-weight:900;color:${c};text-transform:uppercase;margin-bottom:6px;">${titlu}${badge(w.level)}${mesaj ? `<span style="opacity:0.85;margin-left:8px;font-size:12px;font-weight:700;">${mesaj}</span>` : ''}</div>`;
            html += `<div style="margin-bottom:6px;"><b style="color:${c}">Județ:</b> ${judet}</div>`;
            html += `<div style="margin-bottom:6px;"><b style="color:${c}">Interval:</b> ${iv}</div>`;
            html += `<div style="margin-bottom:6px;"><b style="color:${c}">Fenomene:</b> ${fen}</div>`;
            if (detalii) {
              const hlNames = bin?.attributes?.highlight_names || [
                'sud-estul Moldovei', 'sudul Moldovei', 'Galațiului', 'Galatiului', judet, 'Galati',
              ];
              const hlBare = bin?.attributes?.highlight_bare_names || ['Moldovei', 'Moldova'];
              html += `<div style="margin-top:8px;line-height:1.45;font-size:13px;"><b style="color:${c}">Detalii:</b> ${highlightLocal(detalii, c, hlNames, hlBare)}</div>`;
            }

            let mapId = resolveMapId(w, i);
            if (mapId && usedIds.has(mapId)) {
              mapId = allIds.find(id => !usedIds.has(id)) || mapId;
            }
            if (mapId) {
              usedIds.add(mapId);
              html += mapImg(mapId, w.official_map_path);
              // GIS only when the integration wrote /local/cod_galben/gis_{id}.json
              if (w.gis_map_path) {
                html += mapGis(mapId, w.gis_map_path);
              }
            }
            html += `</div>`;
          }

          // Nowcasting: card separat — vezi examples/lovelace_card_nowcasting.yaml

          return html || 'Nu sunt mesaje de afișat.';
        })();
      ]]]
